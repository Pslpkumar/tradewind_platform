get:
  tags: [Orders]
  operationId: getOrder
  summary: Get an order by id
  parameters:
    - name: id
      in: path
      required: true
      description: Order id
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Order found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/OrderResponse.yml'
    '400':
      description: The id is not a valid UUID (ORD-400-MALFORMED)
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/Problem.yml'
    '404':
      description: Order not found (ORD-404)
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/Problem.yml'
    '500':
      description: Unexpected error (ORD-500)
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/Problem.yml'