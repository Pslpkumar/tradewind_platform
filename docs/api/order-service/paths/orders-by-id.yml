get:
  tags: [Orders]
  operationId: getOrder
  summary: Get an order by id
  parameters:
    - name: id
      in: path
      required: true
      description: Order id
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Order found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/OrderResponse.yml'
    '404':
      description: Order not found